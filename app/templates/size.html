<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>เลือกไซส์</title>


<style>

body{

margin:0;

background:#f4f4f4;

font-family:Arial;

}



.header{

text-align:center;

padding:20px;

font-size:26px;

font-weight:bold;

}



.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

padding:20px;

}



.size{

height:100px;

background:white;

border-radius:20px;

display:flex;

align-items:center;

justify-content:center;

font-size:35px;

font-weight:bold;

box-shadow:0 3px 10px #ddd;

}



.size:active{

background:black;

color:white;

}


</style>


</head>


<body>


<div class="header">

{{ category }}

</div>


<div class="grid">


{% for size in sizes %}

<a href="/sell/{{ category }}/{{ size }}"
style="text-decoration:none;color:inherit">


<div class="size">

{{ size }}

</div>


{% endfor %}


</div>



</body>


</html>
