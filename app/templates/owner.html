<style>

h1{
    text-align:center;

    font-size:42px;
}

}

.menu{
    max-width:700px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
}

.menu a{

}

.card{

    background:white;

    border-radius:22px;

    padding:24px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 4px 12px rgba(0,0,0,.12);

    transition:.2s;

    cursor:pointer;

}

.card:hover{

    transform:translateY(-3px);

    box-shadow:0 8px 18px rgba(0,0,0,.18);

}

.left{

    display:flex;

    align-items:center;

    gap:18px;

}

.icon{

    font-size:42px;

}

.title{

    font-size:28px;

    font-weight:bold;

    color:#222;

}

.arrow{
