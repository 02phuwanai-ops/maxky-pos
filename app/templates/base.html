<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>{{ title if title else "MAXKY POS" }}</title>

<link rel="stylesheet" href="/static/css/style.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f172a">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: #f8fafc;
}

/* =========================================
   MAXKY POS Header (Modern Glass Bar)
========================================= */

.header {
    background: #0f172a; /* สีเทาดำพรีเมียม */
    color: white;
    padding: 12px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    position: sticky;
    top: 0;
    z-index: 100;
}

/* กล่องด้านใน */
.header-inner {
    max-width: 1180px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

/* ชื่อระบบ */
.header-brand {
    font-size: 22px;
    font-weight: 800;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.5px;
}

.brand-accent {
    color: #38bdf8; /* แซมสีฟ้าสดใส */
}

/* รายได้ด้านขวา & แถบสถานะ */
.header-revenue {
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
}

/* ป้ายสถานะเน็ต */
.network-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 50px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.3s ease;
}

.status-online {
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(74, 222, 128, 0.3);
}

.status-offline {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(248, 113, 113, 0.3);
}

/* กล่องแคปซูลแสดงรายได้ (เน้นเด่นชัด) */
.revenue-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 5px 14px;
    border-radius: 50px;
    backdrop-filter: blur(8px);
}

.header-revenue-label {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
}

/* ตัวเลขยอดขายแบบไฮไลท์ */
.header-revenue-value {
    font-size: 20px;
    font-weight: 800;
    color: #4ade80; /* สีเขียวนีออน สว่างสะดุดตา */
    letter-spacing: -0.5px;
}

/* หน่วยบาท */
.header-revenue-unit {
    font-size: 12px;
    color: #cbd5e1;
    font-weight: 600;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .05);
}

/* =========================================
   Mobile Optimization
========================================= */

@media(max-width:700px) {
    .header {
        padding: 10px 14px;
    }

    .header-inner {
        gap: 8px;
    }

    .header-brand {
        font-size: 18px;
    }

    .revenue-pill {
        padding: 4px 10px;
    }

    .header-revenue-label {
        display: none; /* ซ่อนข้อความในจอมือถือเพื่อไม่ให้แน่น */
    }

    .header-revenue-value {
        font-size: 17px;
    }

    .header-revenue-unit {
        font-size: 11px;
    }

    .container {
        padding: 14px;
    }
}

</style>

<!-- ⚡ Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ PWA Service Worker Ready'))
        .catch(err => console.error('❌ Service Worker Error:', err));
    });
  }
</script>

<script>
// 5. เช็กการเชื่อมต่อเน็ตแบบชัวร์ 100% (แก้ปัญหา Method HEAD โดน Block)
async function checkRealOnlineStatus() {
    if (!navigator.onLine) return false;

    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500); 
        
        const response = await fetch('/api/recent-sales?check=' + Date.now(), { 
            method: 'GET',
            cache: 'no-store',
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        return response.ok;
    } catch (e) {
        return false;
    }
}

// 6. ตรวจจับสถานะการเชื่อมต่อเน็ต
async function updateNetworkStatus() {
    const statusBadge = document.getElementById('networkStatus');
    if (!statusBadge) return;

    if (!navigator.onLine) {
        statusBadge.className = 'network-badge status-offline';
        statusBadge.innerText = '🔴 Offline';
        return;
    }

    const isOnline = await checkRealOnlineStatus();

    if (isOnline) {
        statusBadge.className = 'network-badge status-online';
        statusBadge.innerText = '🟢 Online';
        if (typeof syncOfflineData === 'function') syncOfflineData();
    } else {
        statusBadge.className = 'network-badge status-offline';
        statusBadge.innerText = '🔴 Offline';
    }
}
</script>

</head>

<body>

<div class="header">
    <div class="header-inner">

        <!-- MAXKY POS Brand Logo -->
        <a href="/" style="text-decoration: none; color: inherit; cursor: pointer;">
            <div class="header-brand">
                <span>👕</span>
                <span>MAXKY <span class="brand-accent">POS</span></span>
            </div>
        </a>

        <!-- รายได้วันนี้ & แสดงสถานะ Online/Offline -->
        <div class="header-revenue">
            <span id="networkStatus" class="network-badge status-online">🟢 Online</span>

            <!-- กล่องแคปซูลยอดขายแบบไฮไลต์ -->
            <div class="revenue-pill">
                <span class="header-revenue-label">💰 รายได้วันนี้</span>
                <strong id="headerRevenue" class="header-revenue-value">0</strong>
                <span class="header-revenue-unit">บาท</span>
            </div>
        </div>

    </div>
</div>

<div class="container">
{% block content %}
{% endblock %}
</div>

<!-- 🔊 สคริปต์เพิ่มเสียงปิ๊บและระบบสั่นเมื่อกดปุ่ม -->
<script>
// 1. ฟังก์ชันสร้างเสียง Beep สั้นๆ
function playClickSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine'; 
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 

        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); 
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08); 

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.08);
    } catch (e) {
    }
}

// 2. ฟังก์ชันสั่งให้สั่น (เฉพาะมือถือ)
function triggerVibrate() {
    if ("vibrate" in navigator) {
        navigator.vibrate(30); 
    }
}

// 3. ดักจับการกดปุ่ม ปุ่มลิงก์ หรือ Card ทุกตัวในหน้าเว็บ
document.addEventListener("click", function(event) {
    const target = event.target.closest("button, a, .btn, .card, select, input[type='submit'], input[type='button']");
    if (target) {
        playClickSound();  
        triggerVibrate();  
    }
});
</script>

</body>
</html>
