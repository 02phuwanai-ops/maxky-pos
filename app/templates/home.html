{% extends "base.html" %}

{% block content %}

<style>
/* จัดโครงสร้างหน้าสไตล์ Minimal Soft Pastel */
.home-container {
    max-width: 960px;
    margin: 20px auto 40px; /* ลด margin-top ให้ชิดด้านบนมากขึ้น */
    text-align: center;
    padding: 0 20px;
}

.home-title {
    font-size: 36px;
    font-weight: 800;
    color: #1e293b;
    margin: 0 0 6px 0;
    letter-spacing: -0.5px;
}

.home-subtitle {
    font-size: 15px;
    color: #64748b;
    margin-bottom: 30px; /* ลดระยะห่างระหว่างข้อความกับปุ่ม */
    font-weight: 400;
}

/* Grid สำหรับการ์ดเมนู */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin: 0 auto;
}

/* การ์ดสไตล์ Minimal Soft White Card */
.card {
    text-decoration: none;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 24px;
    padding: 36px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    position: relative;
    overflow: hidden;
}

/* พื้นหลังไอคอนทรงกลมสีอ่อนๆ (Soft Icon Circle) */
.icon-wrapper {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    transition: transform 0.3s ease, background-color 0.3s ease;
}

.card-icon {
    font-size: 38px;
    line-height: 1;
}

.card h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    color: #334155;
    transition: color 0.3s ease;
}

/* 1. ปุ่มขายสินค้า (Soft Emerald Pastel) */
a.card[href="/sale"] .icon-wrapper {
    background: #e6f4ea;
}
a.card[href="/sale"]:hover {
    border-color: #a7f3d0;
    background: #f0fdf4;
    transform: translateY(-6px);
    box-shadow: 0 12px 24px -4px rgba(16, 185, 129, 0.12);
}
a.card[href="/sale"]:hover .icon-wrapper {
    background: #d1fae5;
    transform: scale(1.08);
}
a.card[href="/sale"]:hover h2 {
    color: #059669;
}

/* 2. ปุ่มรายรับ-รายจ่าย (Soft Amber Pastel) */
a.card[href="/account"] .icon-wrapper {
    background: #fef3c7;
}
a.card[href="/account"]:hover {
    border-color: #fde68a;
    background: #fffbeb;
    transform: translateY(-6px);
    box-shadow: 0 12px 24px -4px rgba(245, 158, 11, 0.12);
}
a.card[href="/account"]:hover .icon-wrapper {
    background: #fef08a;
    transform: scale(1.08);
}
a.card[href="/account"]:hover h2 {
    color: #d97706;
}

/* 3. ปุ่ม OWNER (Soft Purple/Pink Pastel) */
a.card[href="/owner-login"] .icon-wrapper {
    background: #fce7f3;
}
a.card[href="/owner-login"]:hover {
    border-color: #fbcfe8;
    background: #fdf2f8;
    transform: translateY(-6px);
    box-shadow: 0 12px 24px -4px rgba(236, 72, 153, 0.12);
}
a.card[href="/owner-login"]:hover .icon-wrapper {
    background: #fbcfe8;
    transform: scale(1.08);
}
a.card[href="/owner-login"]:hover h2 {
    color: #db2777;
}

/* Responsive สำหรับมือถือ */
@media (max-width: 768px) {
    .home-container {
        margin: 15px auto 30px;
    }
    .menu-grid {
        grid-template-columns: 1fr;
        gap: 16px;
    }
    .card {
        padding: 24px 20px;
        flex-direction: row;
        justify-content: flex-start;
        gap: 20px;
        border-radius: 18px;
    }
    .icon-wrapper {
        width: 60px;
        height: 60px;
        margin-bottom: 0;
    }
    .card-icon {
        font-size: 30px;
    }
    .card h2 {
        font-size: 18px;
    }
}
</style>

<div class="home-container">
    <h1 class="home-title">MAXKY POS</h1>
    <p class="home-subtitle">Fashion Store Management</p>

    <div class="menu-grid">
        <!-- 1. ขายสินค้า -->
        <a class="card" href="/sale">
            <div class="icon-wrapper">
                <span class="card-icon">👕</span>
            </div>
            <h2>ขายเสื้อ</h2>
        </a>

        <!-- 2. รายรับ - รายจ่าย -->
        <a class="card" href="/account">
            <div class="icon-wrapper">
                <span class="card-icon">💰</span>
            </div>
            <h2>รายรับ - รายจ่าย</h2>
        </a>

        <!-- 3. OWNER -->
        <a class="card" href="/owner-login">
            <div class="icon-wrapper">
                <span class="card-icon">👑</span>
            </div>
            <h2>OWNER</h2>
        </a>
    </div>
</div>

{% endblock %}
